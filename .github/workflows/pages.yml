# テスト公開: 作業ブランチ main-jxttta に push されたら、ビルドして GitHub Pages に出す
# (https://luarietakamiya-dotcom.github.io/ZUNZUN/。2026-10-01 ユーザー指示「main-jxttta から」)。
# 初回だけ、リポジトリの設定が 2 つ要る:
# - Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
# - Settings → Environments → github-pages → Deployment branches and tags に main-jxttta を足す
#   (Pages は最初、既定のブランチ (main) からしか出せない)
name: Pages

on:
  push:
    branches: [main-jxttta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          ZUNZUN_BASE: /ZUNZUN/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
