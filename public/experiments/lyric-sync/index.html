<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VS 歌詞同期・隔離実験</title>
<style>body{background:#101018;color:#ededff;font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}button,input,select{font:inherit;padding:10px;margin:5px;background:#29243c;color:white;border:1px solid #756b9d;border-radius:6px}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#181824;padding:20px}p{line-height:1.7}</style>
<h1>VS 歌詞同期・隔離実験</h1><p>実験用です。VSの歌詞やプロジェクトに結果を適用しません。認識はこのブラウザ内で行います。選んだ音源をサーバーへ送る処理はありません。開始すると、ライブラリをjsDelivrから、Whisper tinyモデルをHugging Faceから取得します。初回のモデル等は約44 MB以上。外部通信と端末の負荷が発生します。</p>
<label>処理方式 <select id="device"><option value="wasm">WASM</option><option value="webgpu">WebGPU</option></select></label><button id="prepare">モデルを準備・測定</button><button id="silence" disabled>3秒の無音を検査</button><button id="cancel" disabled>中止して解放</button>
<p>完全な無音は認識前に棄却します。この場合、認識時間は測定しません。実曲は音源・正しい歌詞・手で合わせた行頭時刻をそろえて比較します。準備中・認識中も中止できます。</p><label>実曲（端末内で処理） <input id="audio" type="file" accept="audio/*" disabled></label><button id="export" disabled>測定JSONを保存</button><pre id="status" role="status">未実行</pre><script type="module" src="./page.js?v=3"></script></html>
