<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>構図サムネイル案（質感つき）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Serif+JP:wght@300;700&family=Noto+Sans+JP:wght@900&family=Kaisei+Tokumin:wght@800&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@800&family=Zen+Old+Mincho:wght@900&display=swap">
<style>
  :root { --bg:#0b0b10; --fg:#ece8df; --mute:#8d8a9a; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.7 "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif; }
  header { padding:24px 20px 4px; max-width:1500px; margin:0 auto; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:.06em; }
  header p { margin:0; color:var(--mute); max-width:78ch; }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:16px; padding:16px 20px 40px; max-width:1500px; margin:0 auto; }
  figure { margin:0; } canvas { display:block; width:100%; height:auto; border:1px solid #23232c; border-radius:4px; }
  figcaption { padding:6px 2px; font-size:13px; color:var(--mute); } figcaption b { color:var(--fg); }
</style>
</head>
<body>
<header><h1>構図サムネイル案 — 6 方向 × 4 構図（実装前の試作）</h1><p>文字を大きくして埋めるのではなく、飛沫・筆跡・粒子・光線・多層の背景で厚みを出す。すべて決まった式（乱数なし）で描いた画で、実装でもそのまま使える。</p></header>
<main id="m"></main>
<script>
'use strict';
const W = 720, H = 270;
const TXT = '夜を越えて', CAP = "WE WON'T STOP";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/** 決まった乱数（seed から） */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ───── 質感の道具 ───── */
let NOISE = null;
function noiseTile() { if (NOISE) return NOISE; const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), d = g.createImageData(256, 256), r = rng(7); for (let i = 0; i < d.data.length; i += 4) { const v = 90 + r() * 165; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); NOISE = c; return c; }
/** 粒子（フィルムの粒・紙の質感）。overlay で重ねる */
function grain(g, a, mode = 'overlay') { g.save(); g.globalCompositeOperation = mode; g.globalAlpha = a; g.fillStyle = g.createPattern(noiseTile(), 'repeat'); g.fillRect(0, 0, W, H); g.restore(); }
/** インクの飛沫: 中心の塊 + 向きに沿って飛ぶ粒と細い筋 */
function splatter(g, x, y, r, color, seed, ang = 0, spread = 0.9, n = 90, a = 1) {
  const R = rng(seed); g.save(); g.fillStyle = color; g.strokeStyle = color; g.globalAlpha = a;
  g.beginPath(); for (let i = 0; i <= 28; i++) { const t = (i / 28) * Math.PI * 2, rr = r * (0.7 + R() * 0.55); g.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr * 0.7); } g.fill();
  for (let i = 0; i < n; i++) {
    const t = ang + (R() - 0.5) * spread * 2, d = r * (0.8 + Math.pow(R(), 1.6) * 7), s = r * (0.03 + R() * 0.16) * (1 - d / (r * 9));
    const px = x + Math.cos(t) * d, py = y + Math.sin(t) * d * 0.8;
    if (R() < 0.35) { g.lineWidth = Math.max(0.6, s * 0.7); g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(t) * s * 7, py + Math.sin(t) * s * 7 * 0.8); g.stroke(); }
    else { g.beginPath(); g.arc(px, py, Math.max(0.6, s), 0, 7); g.fill(); }
  }
  g.restore();
}
/** かすれた筆跡（太い帯 + 乾いた線の欠け） */
function brush(g, x0, y0, x1, y1, w, color, seed, a = 1) {
  const R = rng(seed), L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L, nx = -uy, ny = ux; g.save(); g.fillStyle = color; g.globalAlpha = a;
  const N = 60; g.beginPath();
  for (let i = 0; i <= N; i++) { const t = i / N, j = (R() - 0.5) * w * 0.14; g.lineTo(x0 + ux * L * t + nx * (w / 2 + j), y0 + uy * L * t + ny * (w / 2 + j)); }
  for (let i = N; i >= 0; i--) { const t = i / N, j = (R() - 0.5) * w * 0.14; g.lineTo(x0 + ux * L * t - nx * (w / 2 + j), y0 + uy * L * t - ny * (w / 2 + j)); }
  g.fill();
  g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 0.5;
  for (let k = 0; k < 26; k++) { const o = (R() - 0.5) * w, s = R() * 0.6, e = s + R() * 0.4; g.lineWidth = 0.8 + R() * 1.6; g.beginPath(); g.moveTo(x0 + ux * L * s + nx * o, y0 + uy * L * s + ny * o); g.lineTo(x0 + ux * L * e + nx * o, y0 + uy * L * e + ny * o); g.stroke(); }
  g.restore();
}
/** 放射状の速度線（漫画の集中線） */
function focus(g, cx, cy, color, n, inner, outer, a, seed, gap = 0.3) {
  const R = rng(seed); g.save(); g.fillStyle = color; g.globalAlpha = a;
  for (let i = 0; i < n; i++) { const t = (i / n) * Math.PI * 2 + (R() - 0.5) * 0.05, w = (0.012 + R() * 0.03), r0 = inner * (0.9 + R() * 0.3), r1 = outer * (0.7 + R() * 0.5); g.beginPath(); g.moveTo(cx + Math.cos(t - w) * r1, cy + Math.sin(t - w) * r1); g.lineTo(cx + Math.cos(t) * r0, cy + Math.sin(t) * r0); g.lineTo(cx + Math.cos(t + w) * r1, cy + Math.sin(t + w) * r1); g.fill(); }
  g.restore();
}
/** ハーフトーンの点 */
function halftone(g, x, y, w, h, sp, color, a, fn, ang = 0.5) {
  g.save(); g.fillStyle = color; g.globalAlpha = a; g.beginPath(); g.rect(x, y, w, h); g.clip();
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let i = -40; i < w / sp + 40; i++) for (let j = -40; j < h / sp + 40; j++) { const px = x + i * sp * c - j * sp * s, py = y + i * sp * s + j * sp * c, k = fn(clamp((px - x) / w), clamp((py - y) / h)); if (k > 0.05) { g.beginPath(); g.arc(px, py, sp * 0.5 * k, 0, 7); g.fill(); } }
  g.restore();
}
/** 縁をがたがたにした多角形（破れ・かすれ） */
function rough(g, pts, color, amp, seed, a = 1) {
  const R = rng(seed); g.save(); g.fillStyle = color; g.globalAlpha = a; g.beginPath();
  pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length], n = Math.max(3, Math.floor(Math.hypot(q[0] - p[0], q[1] - p[1]) / 7)); for (let k = 0; k < n; k++) { const t = k / n; g.lineTo(p[0] + (q[0] - p[0]) * t + (R() - 0.5) * amp, p[1] + (q[1] - p[1]) * t + (R() - 0.5) * amp); } });
  g.closePath(); g.fill(); g.restore();
}
/** やわらかい光の玉（ボケ・光の粒）。足し合わせる */
function bokeh(g, n, seed, colors, rmin, rmax, a, area = [0, 0, W, H]) {
  const R = rng(seed); g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) { const x = area[0] + R() * area[2], y = area[1] + R() * area[3], r = rmin + R() * (rmax - rmin), c = colors[Math.floor(R() * colors.length)], gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a * (0.3 + R() * 0.7); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  g.restore();
}
function glow(g, x, y, r, color, a) { g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }
/** 天からの光の筋 */
function rays(g, x, y, color, n, len, a, seed, spread = 0.9, base = Math.PI / 2) {
  const R = rng(seed); g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) { const t = base + (R() - 0.5) * spread, w = 0.01 + R() * 0.035, gr = g.createLinearGradient(x, y, x + Math.cos(t) * len, y + Math.sin(t) * len); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a * (0.4 + R() * 0.6); g.fillStyle = gr; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(t - w) * len, y + Math.sin(t - w) * len); g.lineTo(x + Math.cos(t + w) * len, y + Math.sin(t + w) * len); g.fill(); }
  g.restore();
}
/** 文字: 傾き・字間・硬い影・縁・光・RGB ずれ */
function text(g, str, x, y, size, font, color, o = {}) {
  const chars = [...str]; g.save(); g.translate(x, y); if (o.rot) g.rotate(o.rot); if (o.skew) g.transform(1, 0, o.skew, 1, 0, 0);
  g.font = font.replace('SIZE', size); g.textBaseline = 'middle'; g.textAlign = 'left';
  const adv = chars.map(c => g.measureText(c).width + size * (o.track || 0)); const total = adv.reduce((a, b) => a + b, 0) - size * (o.track || 0);
  const x0 = o.align === 'left' ? 0 : o.align === 'right' ? -total : -total / 2;
  const draw = (dx, dy, col, mode, a = 1, stroke = 0) => { g.save(); g.globalCompositeOperation = mode || 'source-over'; g.globalAlpha = a * (o.alpha ?? 1); let px = x0 + dx; chars.forEach((c, i) => { if (stroke) { g.lineWidth = stroke; g.strokeStyle = col; g.lineJoin = 'round'; g.strokeText(c, px, dy); } else { g.fillStyle = col; g.fillText(c, px, dy); } px += adv[i]; }); g.restore(); };
  if (o.shadow) for (let k = o.shadow.n; k >= 1; k--) draw(o.shadow.dx * k / o.shadow.n, o.shadow.dy * k / o.shadow.n, o.shadow.color);
  if (o.rgb) { draw(-o.rgb, 0, '#ff2a6d', 'lighter', 0.8); draw(o.rgb, 0, '#00e5ff', 'lighter', 0.8); }
  if (o.glow) { g.save(); g.shadowColor = o.glow; g.shadowBlur = size * 0.35; draw(0, 0, color); g.restore(); }
  if (o.stroke) draw(0, 0, o.stroke.color, 'source-over', 1, o.stroke.w);
  draw(0, 0, color);
  g.restore(); return total;
}
const micro = (g, s, x, y, size, color, a = 0.8, track = 0.3, align = 'left') => { g.save(); g.globalAlpha = a; text(g, s, x, y, size, '400 SIZEpx "DotGothic16",monospace', color, { track, align }); g.restore(); };
const line = (g, x0, y0, x1, y1, color, w, a = 1) => { g.save(); g.strokeStyle = color; g.lineWidth = w; g.globalAlpha = a; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.restore(); };


const SANS = '900 SIZEpx "Noto Sans JP",sans-serif', DELA = '400 SIZEpx "Dela Gothic One",sans-serif', MIN = '700 SIZEpx "Noto Serif JP",serif', MINL = '300 SIZEpx "Noto Serif JP",serif', TOK = '800 SIZEpx "Kaisei Tokumin",serif';

/* ───── 追加の道具 ───── */
function vignette(g, a) { const gr = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.65); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)'); g.save(); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore(); }
function starburst(g, cx, cy, r1, r2, n, color, a = 1, rot = 0) { g.save(); g.fillStyle = color; g.globalAlpha = a; g.beginPath(); for (let i = 0; i < n * 2; i++) { const t = rot + (i / (n * 2)) * Math.PI * 2, r = i % 2 ? r1 : r2; g.lineTo(cx + Math.cos(t) * r, cy + Math.sin(t) * r); } g.closePath(); g.fill(); g.restore(); }
function mountains(g, baseY, amp, color, seed, a = 1, step = 14) { const R = rng(seed); g.save(); g.fillStyle = color; g.globalAlpha = a; g.beginPath(); g.moveTo(0, H); let y = baseY; for (let x = 0; x <= W + step; x += step) { y += (R() - 0.5) * amp * 0.9; y = baseY + (y - baseY) * 0.86 + Math.sin(x / 90 + seed) * amp * 0.3; g.lineTo(x, y); } g.lineTo(W, H); g.fill(); g.restore(); }
function aurora(g, seed, cols) { const R = rng(seed); g.save(); g.globalCompositeOperation = 'lighter'; cols.forEach((c, k) => { for (let i = 0; i < 26; i++) { const x = (i / 25) * W * 1.1 - 20, base = 40 + k * 22 + Math.sin(i * 0.5 + seed + k) * 28, len = 70 + R() * 90, gr = g.createLinearGradient(0, base, 0, base + len); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.3, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = 0.16; g.fillStyle = gr; g.fillRect(x, base, W / 22, len); } }); g.restore(); }
function moon(g, x, y, r, seed) { const R = rng(seed); g.save(); g.beginPath(); g.arc(x, y, r, 0, 7); g.clip(); g.fillStyle = '#cfd6e2'; g.fillRect(x - r, y - r, r * 2, r * 2); for (let i = 0; i < 40; i++) { const cr = r * (0.04 + R() * 0.16), cx = x + (R() - 0.5) * r * 1.8, cy = y + (R() - 0.5) * r * 1.8; g.fillStyle = 'rgba(80,92,112,0.35)'; g.beginPath(); g.arc(cx, cy, cr, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 1; g.beginPath(); g.arc(cx - cr * 0.1, cy - cr * 0.1, cr, 0.3, 3.4); g.stroke(); } const sh = g.createRadialGradient(x - r * 0.35, y - r * 0.3, r * 0.1, x, y, r * 1.1); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.75)'); g.fillStyle = sh; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }
function radar(g, x, y, r, color) { for (let k = 1; k <= 3; k++) { g.save(); g.strokeStyle = color; g.globalAlpha = 0.5 / k + 0.15; g.lineWidth = 1.4; g.beginPath(); g.arc(x, y, r * k / 3, 0, 7); g.stroke(); g.restore(); } line(g, x - r, y, x + r, y, color, 1, 0.5); line(g, x, y - r, x, y + r, color, 1, 0.5); }
function sticker(g, x, y, w, h, ang, color, a = 1) { g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(-w / 2 + 6, -h / 2 + 8, w, h); g.fillStyle = color; g.globalAlpha = a; g.fillRect(-w / 2, -h / 2, w, h); g.restore(); }
function scan(g, a = 0.25, step = 4) { g.save(); g.fillStyle = '#000'; g.globalAlpha = a; for (let y = 0; y < H; y += step) g.fillRect(0, y, W, 1.2); g.restore(); }
function bars(g, x, y, n, w, h, color, seed, a = 0.9) { const R = rng(seed); for (let i = 0; i < n; i++) { g.save(); g.fillStyle = color; g.globalAlpha = a; g.fillRect(x + i * (w + 3), y + h * (1 - R()), w, h); g.restore(); } }
const KLEE = '400 SIZEpx "Klee One","Noto Serif JP",serif', MINK = '900 SIZEpx "Zen Old Mincho",serif';
const bgFill = (g, c) => { g.fillStyle = c; g.fillRect(0, 0, W, H); };

/* ───── 24 構図（6 方向 × 4）。同じ文「夜を越えて」で比べる ───── */
const S = (n, d, f) => ({ n, d, f });
const PIECES = [
  // A ハイパー（黒・ピンク・シアン）
  S('A1　ハイパー・衝撃', '集中線と、左右から飛び込む飛沫・筆跡。傾いた主役に硬い影', (g) => { bgFill(g, '#07070b'); focus(g, W * 0.46, H * 0.5, '#fff', 90, 110, 400, 0.06, 5); splatter(g, 30, 70, 34, '#ff3db8', 11, 0.12, 0.7, 100); brush(g, -20, 112, 230, 88, 28, '#ff3db8', 21, 0.95); splatter(g, W - 24, 200, 32, '#29e6ff', 12, Math.PI + 0.1, 0.7, 100); brush(g, W + 20, 165, W - 240, 188, 26, '#29e6ff', 23, 0.95); text(g, TXT, W * 0.46, H * 0.5, 100, SANS, '#fff', { skew: -0.28, rot: -0.04, shadow: { n: 7, dx: 8, dy: 7, color: '#ff3db8' } }); micro(g, CAP, W * 0.62, H * 0.76, 10, '#29e6ff', 0.95, 0.5); grain(g, 0.12); }),
  S('A2　ハイパー・スラブ', '破れた縁のピンクの太い斜めの帯に載る主役。シアンの細い帯と小さな語尾', (g) => { bgFill(g, '#07070b'); focus(g, W * 0.5, H * 0.5, '#ff3db8', 70, 160, 420, 0.07, 6); rough(g, [[-30, 190], [W + 30, 70], [W + 30, 185], [-30, 300]], '#ff3db8', 10, 41); rough(g, [[-30, 175], [W + 30, 56], [W + 30, 68], [-30, 188]], '#29e6ff', 6, 42, 0.95); text(g, TXT, W * 0.5, H * 0.5, 86, SANS, '#fff', { rot: -0.17, skew: -0.2, shadow: { n: 6, dx: 6, dy: 8, color: '#5a0f40' } }); micro(g, CAP, W * 0.66, H * 0.82, 10, '#29e6ff', 0.95, 0.5); splatter(g, 70, 230, 14, '#29e6ff', 43, -0.4, 1.1, 60); grain(g, 0.13); }),
  S('A3　ハイパー・反復', '輪郭を積み上げた反復。左右の色が違う飛沫と走る筋', (g) => { bgFill(g, '#07070b'); for (let i = -3; i <= 3; i++) { if (!i) continue; g.save(); g.globalAlpha = 0.55 - Math.abs(i) * 0.1; text(g, TXT, W * 0.5 + i * 8, H * 0.5 + i * 38, 84, SANS, i < 0 ? '#29e6ff' : '#ff3db8', { skew: -0.22, stroke: { color: i < 0 ? '#29e6ff' : '#ff3db8', w: 2 }, alpha: 0 }); g.restore(); text(g, TXT, W * 0.5 + i * 8, H * 0.5 + i * 38, 84, SANS, 'rgba(0,0,0,0)', { skew: -0.22, stroke: { color: i < 0 ? '#29e6ff' : '#ff3db8', w: 2 }, alpha: 0.5 - Math.abs(i) * 0.08 }); } text(g, TXT, W * 0.5, H * 0.5, 84, SANS, '#fff', { skew: -0.22, shadow: { n: 6, dx: 7, dy: 6, color: '#ff3db8' } }); brush(g, -10, 40, 200, 30, 12, '#29e6ff', 51, 0.9); brush(g, W + 10, 235, W - 220, 244, 14, '#ff3db8', 52, 0.9); splatter(g, W - 20, 60, 14, '#29e6ff', 53, Math.PI, 0.8, 50); grain(g, 0.12); }),
