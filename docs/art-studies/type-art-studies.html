<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字だけのアート スタディ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@900&family=Noto+Serif+JP:wght@300&family=DotGothic16&family=Klee+One:wght@600&family=Dela+Gothic+One&family=Kaisei+Tokumin:wght@800&display=swap">
<style>
  :root { --bg:#0b0b10; --fg:#ece8df; --mute:#8d8a9a; --line:#25252f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.7 "Hiragino Sans","Yu Gothic","Noto Sans CJK JP","WenQuanYi Zen Hei",sans-serif; }
  header { padding:28px 20px 8px; max-width:1500px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:.08em; font-weight:600; }
  header p { margin:0; color:var(--mute); max-width:70ch; }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:18px; padding:18px 20px 40px; max-width:1500px; margin:0 auto; }
  figure { margin:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#000; }
  canvas { display:block; width:100%; height:auto; aspect-ratio:16/9; }
  figcaption { padding:10px 14px 14px; border-top:1px solid var(--line); }
  figcaption b { display:block; font-size:15px; letter-spacing:.06em; }
  figcaption em { display:block; font-style:normal; color:var(--mute); font-size:13px; margin-top:2px; }
  .bar { position:sticky; top:0; z-index:2; display:flex; gap:10px; align-items:center; padding:10px 20px; background:rgba(11,11,16,.9); border-bottom:1px solid var(--line); }
  button { background:#1b1b26; color:var(--fg); border:1px solid #3a3a4a; border-radius:5px; padding:6px 14px; font:inherit; cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .note { display:block; } }
</style>
</head>
<body>
<div class="bar"><button id="pp">一時停止</button><span style="color:var(--mute)">6 つのスタディ。文字の動きだけで見せる試作（設計用。製品のコードではない）</span></div>
<header>
  <h1>文字だけのアート — スタディ</h1>
  <p>装飾を足して見せるのではなく、文字そのものの性質（重さ・時間・並び・光・影）が動きを決める。画面は「巨大な文字」で埋めるのではなく、主従（大きい字・小さい字・小さな文字の土台・巨大な薄い字）で構図を作り、効果（波紋・星・光・影）を画面全体に及ばせる。色は 3 色以内、背景は暗く、明滅はしない。</p>
</header>
<main id="m"></main>
<script>
'use strict';
const W = 800, H = 450;
const SANS = '"Hiragino Sans","Yu Gothic","Noto Sans CJK JP","WenQuanYi Zen Hei","IPAGothic",sans-serif';
const SERIF = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif, "WenQuanYi Zen Hei","IPAGothic"';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eOut = t => 1 - Math.pow(1 - clamp(t), 3);
const eIn = t => clamp(t) * clamp(t);
const eIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t));
const eBack = (t, s = 1.7) => { t = clamp(t) - 1; return 1 + t * t * ((s + 1) * t + s); };
const hash = (i, k = 0) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
const isKanji = c => /[㐀-鿿]/.test(c);
const isSmallKana = c => /[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ、。ー]/.test(c);

/** 等幅で並べた文字の中心 x を返す */
function slots(ctx, chars, size, track, cx) {
  const ws = chars.map(c => ctx.measureText(c).width + size * track);
  const total = ws.reduce((a, b) => a + b, 0) - size * track;
  let x = cx - total / 2; const out = [];
  ws.forEach((w, i) => { out.push(x + (w - size * track) / 2); x += w; });
  return out;
}
function glyph(ctx, ch, x, y, o = {}) {
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); if (o.sx || o.sy) ctx.scale(o.sx ?? 1, o.sy ?? 1);
  ctx.globalAlpha = clamp(o.a ?? 1);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur ?? 18; }
  if (o.stroke) { ctx.strokeStyle = o.color; ctx.lineWidth = o.stroke; ctx.strokeText(ch, 0, 0); }
  else { ctx.fillStyle = o.color; ctx.fillText(ch, 0, 0); }
  ctx.restore();
}

/** 小さな文字の土台（番号・ラベル・細かい文字の列）。画面の密度を作る。JIZURA の「注釈」「HUD」の考え方を、自分の式で */
function micro(ctx, x, y, str, a = .45, size = 11, color = '#9fb4d6') { ctx.save(); ctx.font = `${size}px "DotGothic16",monospace`; ctx.textAlign = 'left'; ctx.fillStyle = color; ctx.globalAlpha = a; ctx.fillText(str, x, y); ctx.restore(); }
/** 背景の巨大な薄い字（質感）。読ませる文字ではない */
function ghost(ctx, ch, x, y, size, a, font, color = '#ffffff') { ctx.save(); ctx.font = font.replace('SIZE', size); ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.globalAlpha = a; ctx.fillText(ch, x, y); ctx.restore(); }

/* ───────── 1. 水に落ちる言葉（質量）— 主従: 小さめの 1 行 + 画面いっぱいの波紋 + 巨大な薄い字 ───────── */
function s1(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04060e'); g.addColorStop(1, '#0d2147');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const text = [...'夜空に言葉を描く'], size = 70, rest = H * 0.6, yw = rest + size * 0.5, TOUT = 3.5;
  ghost(ctx, '夜', W * 0.2, H * 0.95, 560, 0.05, '900 SIZEpx "Zen Old Mincho",serif', '#9cc4ff');
  const FK = `900 ${size}px "Zen Old Mincho",serif`, FL = `300 ${size}px "Noto Serif JP",serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const xs = slots(ctx, (ctx.font = FK, text), size, 0.08, W / 2);
  const wl = ctx.createLinearGradient(0, 0, W, 0); wl.addColorStop(0, 'rgba(160,210,255,0)'); wl.addColorStop(.5, 'rgba(160,210,255,.6)'); wl.addColorStop(1, 'rgba(160,210,255,0)');
  ctx.fillStyle = wl; ctx.fillRect(0, yw, W, 1.5);
  micro(ctx, 28, 34, 'No.07  /  水面', .5); micro(ctx, W - 150, 34, '04:16 — 04:21', .4); micro(ctx, 28, H - 22, '重さ = 字面の濃さ', .35);
  text.forEach((ch, i) => {
    const m = isKanji(ch) ? 1 : isSmallKana(ch) ? 0.25 : 0.5, t0 = 0.3 + i * 0.17, fall = 0.78 - 0.4 * m, p = (t - t0) / fall, land = t0 + fall;
    if (p < 0) return; let y, a = 1, x = xs[i];
    if (p < 1) { y = -80 + (rest + 80) * p * p; x += Math.sin(t * 4 + i * 2) * 10 * (1 - m); a = clamp(p * 4); }
    else { const tau = t - land; y = rest - Math.abs(Math.sin(tau * 9 + .4)) * Math.exp(-tau * (3 + 4 * m)) * 20 * m; }
    const so = t - (TOUT + i * 0.05); let sink = 0; if (so > 0) { sink = so * so * 90 * (1.2 - m * .5); a *= clamp(1 - so * 1.1); }
    if (p >= 1) for (let k = 0; k < 3; k++) {
      const tau = t - land - k * 0.2; if (tau < 0) continue;
      const r = tau * (260 + 240 * m), al = clamp(1 - tau / 2.1) * (0.3 + 0.4 * m) * clamp(a + .2);
      ctx.strokeStyle = `rgba(170,215,255,${al})`; ctx.lineWidth = 1 + 2.4 * m * (1 - tau / 2.1);
      ctx.beginPath(); ctx.ellipse(x, yw, r, r * 0.14, 0, 0, 7); ctx.stroke();
    }
    ctx.font = isKanji(ch) ? FK : FL;
    glyph(ctx, ch, x, y + sink, { color: '#eef2fa', a });
    glyph(ctx, ch, x + Math.sin(t * 3 + i) * 3, 2 * yw - (y + sink), { color: '#9cc4ff', a: a * 0.22, sy: -1 });
  });
}

/* ───────── 2. 凍った軌跡 — 主従: 1 行 + 画面を横切る輪郭の残像 ───────── */
function s2(ctx, t) {
  ctx.fillStyle = '#04060b'; ctx.fillRect(0, 0, W, H);
  const text = [...'光を追いかけて'], size = 84, y0 = H * 0.55, TOUT = 3.4;
  ghost(ctx, '光', W * 0.78, H * 0.9, 520, 0.045, '300 SIZEpx "Noto Serif JP",serif', '#9fd0ff');
  ctx.font = `300 ${size}px "Noto Serif JP",serif`; ctx.textAlign = 'center';
  const xs = slots(ctx, text, size, 0.05, W / 2);
  ctx.fillStyle = 'rgba(190,225,255,.25)'; ctx.fillRect(0, y0 + size * .62, W, 1);
  micro(ctx, 28, 34, 'No.12  /  軌跡', .5); micro(ctx, W - 130, H - 22, 't = 2.4s', .35);
  text.forEach((ch, i) => {
    const t0 = 0.2 + i * 0.12, dur = 0.7, dir = i % 2 ? 1 : -1;
    const pos = u => { const e = eExpo(u); return { x: xs[i] + dir * (1 - e) * W * 0.9, y: y0 + (1 - e) * (i % 2 ? -1 : 1) * (60 + 20 * (i % 3)), rot: (1 - e) * dir * .35 }; };
    const p = (t - t0) / dur; if (p < 0) return; const fade = 1 - sstep(TOUT, TOUT + .9, t - i * .06);
    for (const f of [.18, .4, .62]) { if (p < f) continue; const q = pos(f), age = clamp((p - f) * 1.3); glyph(ctx, ch, q.x, q.y, { color: '#9fd0ff', stroke: 1.2, rot: q.rot, a: (0.16 + 0.3 * (1 - f)) * clamp(age * 3) * fade }); }
    const q = pos(Math.min(1, p));
    if (p < 1) for (let k = 5; k >= 1; k--) { const qq = pos(clamp(p - k * 0.035)); glyph(ctx, ch, qq.x, qq.y, { color: '#cfe8ff', a: 0.16 / k * clamp(p * 4), rot: qq.rot }); }
    const tl = t - (t0 + dur); if (tl > 0 && tl < .5) glyph(ctx, ch, q.x, q.y, { color: '#e8f4ff', stroke: 1.2, sx: 1 + tl * .35, sy: 1 + tl * .35, a: (1 - tl * 2) * .5 * fade });
    glyph(ctx, ch, q.x, q.y, { color: '#f2f8ff', a: clamp(p * 5) * fade, rot: q.rot });
  });
}

/* ───────── 3. 言葉が整列する — 主従: 小さな 1 行 + 番号の目盛 + 並べ替えの弧 ───────── */
const S3 = (() => {
  const text = [...'終わらない夜の向こうへ'], n = text.length;
  const order = text.map((_, i) => i).sort((a, b) => hash(a, 3) - hash(b, 3));
  let cur = order.slice(); const steps = [];
  for (let s = 0; s < n + 1; s++) { const before = cur.slice(), after = cur.slice(); for (let j = s % 2; j + 1 < n; j += 2) if (after[j] > after[j + 1]) { const tmp = after[j]; after[j] = after[j + 1]; after[j + 1] = tmp; } steps.push({ before, after }); cur = after; }
  return { text, n, steps };
})();
function s3(ctx, t) {
  ctx.fillStyle = '#05090a'; ctx.fillRect(0, 0, W, H);
  const { text, n, steps } = S3, size = 50, y = H * 0.52, pitch = W * 0.082, x0 = W / 2 - (n - 1) * pitch / 2;
  ctx.font = `${size}px "DotGothic16",sans-serif`; ctx.textAlign = 'center';
  const T0 = 0.4, DT = 0.2, TEND = T0 + steps.length * DT, slotX = k => x0 + k * pitch;
  const s = clamp((t - T0) / DT, 0, steps.length - 1e-6), si = Math.floor(s), e = eIO(s - si), st = steps[si];
  const where = a => { const m = {}; a.forEach((g, sl) => { m[g] = sl; }); return m; };
  const wb = where(st.before), wa = where(st.after), fin = t > TEND, fade = 1 - sstep(3.6, 4.2, t);
  // 目盛と番号（小さな文字の土台）
  ctx.fillStyle = `rgba(120,255,200,${0.16 * fade})`; ctx.fillRect(0, y + size * .75, W, 1); ctx.fillRect(0, y - size * .95, W, 1);
  for (let k = 0; k < n; k++) { ctx.fillStyle = `rgba(120,255,200,${0.3 * fade})`; ctx.fillRect(slotX(k), y + size * .75, 1, 8); micro(ctx, slotX(k) - 5, y + size * .75 + 22, String(k + 1).padStart(2, '0'), .4 * fade, 10, '#58d9a8'); }
  const sorted = text.reduce((c, _, g) => c + ((t >= T0 ? (e > 0.98 ? wa[g] : wb[g]) : wb[g]) === g ? 1 : 0), 0);
  micro(ctx, 28, 34, `SORT  ${sorted}/${n}`, .6 * fade, 13, '#58d9a8'); micro(ctx, W - 160, 34, fin ? 'ORDER: OK' : 'ORDER: …', .6 * fade, 13, fin ? '#eafff8' : '#58d9a8');
  text.forEach((ch, g) => {
    const A = wb[g], B = wa[g], ee = t >= T0 ? e : 0, sl = A + (B - A) * ee;
    const yy = y - Math.sign(B - A) * Math.sin(Math.PI * ee) * size * 0.55, done = (t >= T0 ? (e > 0.98 ? wa[g] : wb[g]) : wb[g]) === g, lit = fin || done;
    glyph(ctx, ch, slotX(sl), yy, { color: lit ? '#eafff8' : '#58d9a8', a: (lit ? 1 : 0.5) * fade });
  });
  if (fin) { const on = Math.floor(t * 2) % 2 === 0; ctx.fillStyle = `rgba(160,255,215,${(on ? 0.85 : 0.1) * fade})`; ctx.fillRect(slotX(n - 1) + pitch * .6, y - size * .62, size * .26, size * 1.05); }
}

/* ───────── 4. 星座が文字を結ぶ — 主従: 読む文字は小さく、星と線が画面を満たす ───────── */
function s4(ctx, t) {
  const g = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, W * .75); g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#02030a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const text = [...'名前を呼んで'], size = 62, fade = 1 - sstep(3.5, 4.1, t), n = text.length, T0 = 0.4, DT = 0.5;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(Math.sin(t * .35) * 0.03); ctx.scale(1.06, 1.06); ctx.translate(-W / 2, -H / 2);
  for (let i = 0; i < 240; i++) { const x = hash(i, 1) * W, yy = hash(i, 2) * H, tw = .35 + .65 * (.5 + .5 * Math.sin(t * (1 + hash(i, 4) * 2) + i)); ctx.fillStyle = `rgba(200,220,255,${0.7 * tw * (0.3 + hash(i, 5) * .7)})`; const r = 1 + hash(i, 6) * 1.6; ctx.fillRect(x, yy, r, r); }
  ghost(ctx, '名', W * 0.5, H * 0.98, 600, 0.04, '400 SIZEpx "Klee One",serif', '#aac8ff');
  ctx.font = `600 ${size}px "Klee One",serif`; ctx.textAlign = 'center';
  const pts = text.map((_, i) => [W * (0.14 + i * 0.145), H * (0.5 + Math.sin(i * 2.1) * 0.2)]);
  for (let i = 0; i < n - 1; i++) { const e = clamp((t - (T0 + i * DT)) / DT); if (e <= 0) continue; const [ax, ay] = pts[i], [bx, by] = pts[i + 1]; ctx.strokeStyle = `rgba(170,215,255,${0.95 * fade})`; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + (bx - ax) * eOut(e), ay + (by - ay) * eOut(e)); ctx.stroke(); }
  text.forEach((ch, i) => {
    const lit = i === 0 ? eOut((t - T0 + .2) / .6) : eOut((t - (T0 + (i - 1) * DT + DT * .85)) / 0.6), [px, py] = pts[i];
    const r = size * (1.1 + .4 * lit), gg = ctx.createRadialGradient(px, py, 0, px, py, r); gg.addColorStop(0, `rgba(190,220,255,${0.5 * lit * fade})`); gg.addColorStop(1, 'rgba(190,220,255,0)'); ctx.fillStyle = gg; ctx.fillRect(px - r, py - r, r * 2, r * 2);
    ctx.fillStyle = `rgba(235,245,255,${0.95 * lit * fade})`; ctx.beginPath(); ctx.arc(px, py, 3.5 * lit, 0, 7); ctx.fill();
    if (lit > .05) { ctx.strokeStyle = `rgba(230,240,255,${0.6 * lit * fade})`; ctx.lineWidth = 1.2; const Lh = size * .8 * lit; ctx.beginPath(); ctx.moveTo(px - Lh, py); ctx.lineTo(px + Lh, py); ctx.moveTo(px, py - Lh); ctx.lineTo(px, py + Lh); ctx.stroke(); micro(ctx, px + 10, py - 12, 'α' + (i + 1), .55 * lit * fade, 11, '#aac8ff'); }
    glyph(ctx, ch, px, py + size * 0.95, { color: '#f3f7ff', a: (0.12 + 0.88 * lit) * fade, glow: 'rgba(160,200,255,.9)', blur: 14 * lit });
  });
  ctx.restore();
}

/* ───────── 5. 回る光と長い影 — 主従: 主役 + 主役の縁に揃えた小さな語尾 ───────── */
function s5(ctx, t) {
  const bg = ctx.createRadialGradient(W / 2, H * .5, 10, W / 2, H * .5, W * .65); bg.addColorStop(0, '#1a1022'); bg.addColorStop(1, '#050408');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const hero = [...'もう一度'], tail = [...'だけ'], size = 150, tsize = 46, BEAT = 0.5;
  const fade = 1 - sstep(3.6, 4.1, t), enter = eOut(t / 0.35), bi = Math.floor(t / BEAT), since = t - bi * BEAT;
  const A = [0.62, 1.57, 2.52], prev = A[(bi + 2) % 3], cur = A[bi % 3], angle = prev + (cur - prev) * eBack(since / 0.2, 1.4), pulse = Math.exp(-since * 9);
  ctx.font = `400 ${size}px "Dela Gothic One",sans-serif`; ctx.textAlign = 'center';
  const xs = slots(ctx, hero, size, 0.0, W * 0.44), y = H * 0.56, right = xs[xs.length - 1] + size * 0.5;
  const Ls = size * (0.5 + 0.12 * pulse) * enter, dx = Math.cos(angle), dy = Math.sin(angle), N = 90;
  const drawLine = (chars, px, py, sz, delay, font) => chars.forEach((ch, i) => {
    ctx.font = font; const gi = clamp((t - delay - i * 0.07) / 0.3), sc = 1 + 0.04 * pulse, L = Ls * (sz / size);
    for (let k = N; k >= 1; k--) { const f = k / N; glyph(ctx, ch, px[i] + dx * L * f, py + dy * L * f, { color: f < .55 ? '#ff48c4' : '#8a2f96', a: (1 - f * f) * 0.75 * fade * eOut(gi), sx: sc, sy: sc }); }
    glyph(ctx, ch, px[i], py + (1 - eOut(gi)) * -60, { color: '#ffffff', a: eOut(gi) * fade, sx: sc, sy: sc });
  });
  drawLine(hero, xs, y, size, 0, `400 ${size}px "Dela Gothic One",sans-serif`);
  // 語尾は主役の右下の縁に揃え、遅れて小さく入る
  drawLine(tail, [right + tsize * 0.75, right + tsize * 1.85], y + size * 0.0, tsize, 0.35, `400 ${tsize}px "Dela Gothic One",sans-serif`);
  micro(ctx, 28, 34, 'BPM 120  /  光源 ' + (bi % 3 + 1), .55 * fade, 12, '#ff7bd6');
}

/* ───────── 6. 光が読む — 主従: 1 行 + 本文を細かく並べた「読まれる前の文字の野」 ───────── */
function s6(ctx, t) {
  ctx.fillStyle = '#030303'; ctx.fillRect(0, 0, W, H);
  const text = [...'君がいた'], size = 112, y = H * 0.58;
  const T0 = 0.4, TPASS = 2.4, lightX = -W * 0.1 + eIO((t - T0) / TPASS) * W * 1.2, fade = 1 - sstep(3.5, 4.2, t);
  // 読まれる前の文字の野（小さく、薄く、光が通ると濃くなる）
  ctx.font = `800 13px "Kaisei Tokumin",serif`; ctx.textAlign = 'left';
  for (let r = 0; r < 20; r++) for (let c = 0; c < 36; c++) { const x = 14 + c * 22, yy = 22 + r * 22, d = lightX - x, a = (0.06 + 0.3 * sstep(-30, 140, d) * (1 - sstep(140, 420, d))) * fade; ctx.globalAlpha = a; ctx.fillStyle = '#f6f1e8'; ctx.fillText('君がいた'[(r + c) % 4], x, yy); }
  ctx.globalAlpha = 1;
  const bw = W * 0.2, g = ctx.createLinearGradient(lightX - bw, 0, lightX + bw, 0);
  g.addColorStop(0, 'rgba(255,250,240,0)'); g.addColorStop(.5, `rgba(255,250,240,${0.14 * fade * sstep(0, .5, t)})`); g.addColorStop(1, 'rgba(255,250,240,0)');
  ctx.fillStyle = g; ctx.fillRect(lightX - bw, 0, bw * 2, H); ctx.fillStyle = `rgba(255,250,240,${0.5 * fade * sstep(0, .5, t)})`; ctx.fillRect(lightX - 1, 0, 2, H);
  ctx.font = `800 ${size}px "Kaisei Tokumin",serif`; ctx.textAlign = 'center';
  const wide = slots(ctx, text, size, 0.5, W / 2), tight = slots(ctx, text, size, 0.08, W / 2);
  text.forEach((ch, i) => {
    const d = lightX - tight[i], lit = sstep(-60, 120, d), x = wide[i] + (tight[i] - wide[i]) * eOut(lit);
    ctx.save(); ctx.fillStyle = '#030303'; ctx.globalAlpha = 0.85 * lit * fade; ctx.fillRect(x - size * .55, y - size * .85, size * 1.1, size * 1.05); ctx.restore();   // 字の背に暗い面を敷き、野から浮かせる
    glyph(ctx, ch, x, y, { color: '#f6f1e8', a: (0.04 + 0.96 * lit) * fade, glow: 'rgba(255,245,225,.8)', blur: 26 * Math.max(0, 1 - Math.abs(d) / 220) });
  });
}

const STUDIES = [
  { n: '1　水に落ちる言葉', ft: '漢字 = Zen Old Mincho Black（重い墨）／かな = Noto Serif JP Light（軽い）', r: '法則: 字面の濃さが重さになる。漢字は速く落ちて大きな波紋、かなは揺れながら静かに。', f: s1 },
  { n: '2　凍った軌跡', ft: 'Noto Serif JP Light（細い明朝）', r: '法則: 動いた時間が空間に残る。通り過ぎた姿が薄い輪郭として凍りつく。', f: s2 },
  { n: '3　言葉が整列する', ft: 'DotGothic16（ドット）', r: '法則: 並べ替えの過程が演出。正しい位置に着いた字だけが灯る。', f: s3 },
  { n: '4　星座が文字を結ぶ', ft: 'Klee One（手書きの星図）', r: '法則: 読む順に線が伸び、結ばれた字が星になる。', f: s4 },
  { n: '5　回る光と長い影', ft: 'Dela Gothic One（極太）', r: '法則: 拍ごとに光源の向きが替わり、影が字に彫りを与える。字そのものは動かない。', f: s5 },
  { n: '6　光が読む', ft: 'Kaisei Tokumin（劇的な太細の明朝）', r: '法則: 光が通った字だけが現れ、字間が詰まる。装飾は光ひとつだけ。', f: s6 },
];
const LOOP = 4.6, ctxs = [];
const main = document.getElementById('m');
STUDIES.forEach((s, i) => {
  const fig = document.createElement('figure');
  fig.innerHTML = `<canvas width="${W}" height="${H}"></canvas><figcaption><b>${s.n}</b><em>${s.r}</em><em>書体: ${s.ft}</em></figcaption>`;
  main.appendChild(fig); ctxs.push(fig.querySelector('canvas').getContext('2d'));
});
window.renderAt = (i, t) => { const c = ctxs[i]; c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.textBaseline = 'alphabetic'; STUDIES[i].f(c, t); };
let paused = false, t0 = performance.now(), off = 0;
document.getElementById('pp').onclick = e => { paused = !paused; e.target.textContent = paused ? '再生' : '一時停止'; if (!paused) t0 = performance.now(); else off += (performance.now() - t0) / 1000; };
const FONT_TEXT = '夜空に言葉を描く光を追いかけて終わらない夜の向こうへ名前を呼んでもう一度だけ君がいた';
const FONT_SPECS = ['900 40px "Zen Old Mincho"','300 40px "Noto Serif JP"','40px "DotGothic16"','600 40px "Klee One"','40px "Dela Gothic One"','800 40px "Kaisei Tokumin"'];
let fontsReady = false; Promise.all(FONT_SPECS.map(f => document.fonts.load(f, FONT_TEXT).catch(() => {}))).then(() => { fontsReady = true; });
(function loop() { if (!paused && fontsReady) { const t = (off + (performance.now() - t0) / 1000) % LOOP; ctxs.forEach((_, i) => window.renderAt(i, t)); } requestAnimationFrame(loop); })();
</script>
